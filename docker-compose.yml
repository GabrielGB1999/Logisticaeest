services:
  logistica:
    build: .
    image: logistica-eestn4:latest
    container_name: logistica-eestn4
    restart: unless-stopped

    # Variables del archivo .env (copiar de .env.example la primera vez).
    env_file:
      - .env

    environment:
      # El puerto interno queda fijo. El puerto con el que se entra desde la red
      # se cambia con HOST_PORT en el .env, no acá.
      PORT: 5000
      # Carpeta de datos dentro del contenedor. Se puede cambiar desde el .env.
      DATA_DIR: ${DATA_DIR:-/data}

    ports:
      - "${HOST_PORT:-5000}:5000"

    volumes:
      # Todo lo que hay que respaldar vive acá: la base de datos, las planillas
      # para importar y los reportes guardados.
      - ./data:/data
      # Para tener las planillas en una carpeta compartida del servidor,
      # descomentar y ajustar la ruta de la izquierda, y poner en el .env:
      #   EXCEL_DIR=/planillas
      # - /srv/compartido/planillas:/planillas

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
